---
# Vérification post-déploiement : preuve par lsof et par connexion, pas par existence.
- name: Identifier le PID du daemon Quick Apply
  ansible.builtin.command:
    cmd: pgrep -f claude_desktop_quick
  register: quick_pids
  changed_when: false
  failed_when: false
  tags: [verify]

- name: Vérifier le release chargé par le daemon (lsof)
  ansible.builtin.shell: |
    set -o pipefail
    lsof -p {{ quick_pids.stdout.split()[0] }} 2>/dev/null | grep -m1 'bin/python3' || true
  register: daemon_lsof
  changed_when: false
  when: quick_pids.stdout | length > 0
  tags: [verify]

- name: Contrôler que le daemon tourne sur le release attendu
  ansible.builtin.assert:
    that:
      - quick_pids.stdout | length > 0
      - (reprise_release_sha | length == 0) or (reprise_release_sha in daemon_lsof.stdout)
    fail_msg: "Daemon absent ou mauvais release : {{ daemon_lsof.stdout | default('n/a') }}"
    success_msg: "Daemon OK : {{ daemon_lsof.stdout | default('release courant') }}"
  tags: [verify]

- name: Sondes de vérification via API module (verify des intégrations)
  ansible.builtin.command:
    cmd: >
      {{ reprise_release_runtime_python }} -E -s -B
      {{ role_path }}/files/verify_all.py
      --helpers {{ reprise_helpers | quote }}
      --project {{ reprise_project_root | quote }}
      --harness-project {{ reprise_harness_project | quote }}
      --harness-profile {{ reprise_harness_profile | quote }}
  register: verify_result
  changed_when: false
  tags: [verify]

- name: Restituer les vérifications
  ansible.builtin.debug:
    msg: "{{ verify_result.stdout_lines }}"
  tags: [verify]
