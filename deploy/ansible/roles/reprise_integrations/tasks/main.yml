---
# Ré-application des intégrations managées via l'API module Python (les CLI sont muettes).
# Invariant du dépôt : les fichiers managés ne sont jamais écrits à la main —
# on invoque toujours les outils propriétaires (plan -> apply -> verify).
- name: Localiser le dernier bundle construit
  ansible.builtin.find:
    paths: "{{ reprise_build_app_path }}"
    patterns: "Reprise.app"
    file_type: directory
    recurse: true
  register: reprise_bundles

- name: Sélectionner le bundle courant
  ansible.builtin.set_fact:
    reprise_app: "{{ reprise_bundles.files | map(attribute='path') | sort(attribute='mtime', reverse=true) | first }}"

- name: Dériver le répertoire helpers du bundle
  ansible.builtin.set_fact:
    reprise_helpers: "{{ reprise_app }}/Contents/Resources/helpers"

- name: Vérifier que le répertoire helpers existe
  ansible.builtin.stat:
    path: "{{ reprise_helpers }}"
  register: helpers_dir

- name: Échouer si le bundle n'a pas de helpers
  ansible.builtin.fail:
    msg: "Helpers introuvables dans {{ reprise_app }}"
  when: not helpers_dir.stat.exists

- name: Appliquer les intégrations managées (claude, chatgpt, harness)
  ansible.builtin.command:
    cmd: >
      {{ reprise_app }}/Contents/Resources/runtime/bin/python3 -E -s -B
      {{ role_path }}/files/apply_integrations.py
      --helpers {{ reprise_helpers | quote }}
      --integrations {{ reprise_integrations | join(',') }}
      --project {{ reprise_project_root | quote }}
      --harness-project {{ reprise_harness_project | quote }}
      --harness-profile {{ reprise_harness_profile | quote }}
  register: integrations_result
  changed_when: "'CHANGED' in integrations_result.stdout"
  tags: [integrations]

- name: Restituer le résultat des intégrations
  ansible.builtin.debug:
    msg: "{{ integrations_result.stdout_lines }}"
  tags: [integrations]
