<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reprise · Agent Resume</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,sans-serif;color:#24352f;background:#f4f5f0}*{box-sizing:border-box}body{margin:0;padding:48px 24px}main{max-width:820px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px}.mark{width:46px;height:46px;background:#244c3e;border-radius:15px;color:white;display:grid;place-items:center;font-size:25px}.brand{display:flex;align-items:center;gap:14px}h1{font-size:25px;margin:0;letter-spacing:-.8px}.sub{color:#6e7971;font-size:13px;margin:5px 0}.local{font-size:12px;color:#386950;background:#e4ecdf;padding:8px 12px;border-radius:30px}.summary{margin:32px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat,article{background:#fff;border:1px solid #e2e6dc;border-radius:20px;padding:22px}.stat b{display:block;font-size:30px;font-weight:550}.stat span{font-size:12px;color:#778277}h2{font-size:14px;font-weight:550;margin:24px 0 14px}article{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:16px}h3{font-size:16px;margin:0 0 8px}p{font-size:13px;color:#6e7971;margin:5px 0}.badge{color:#386950}button{border:1px solid #d8dfd3;background:#f5f7f1;padding:10px 15px;border-radius:10px;color:#244c3e;cursor:pointer;font:inherit;font-size:13px}button:hover{background:#e4ecdf}button:disabled{opacity:.5;cursor:default}.empty{text-align:center;padding:50px 25px;background:#fff;border:1px dashed #d7dfd0;border-radius:20px}.empty strong{font-weight:550}footer{font-size:12px;color:#7c877e;margin-top:25px;line-height:1.7}#notice{color:#815f35;min-height:20px;font-size:13px}@media(max-width:500px){body{padding:25px 16px}.local{display:none}.stat{padding:15px}article{align-items:flex-start}}
</style><main><header><div class="brand"><div class="mark">↻</div><div><h1>Reprise</h1><p class="sub">Le travail reprend au bon moment.</p></div></div><span class="local">● Sur ce Mac</span></header><section class="summary"><div class="stat"><b id="ready">0</b><span>reprises prévues</span></div><div class="stat"><b id="running">0</b><span>en cours</span></div><div class="stat"><b id="paused">0</b><span>en pause</span></div></section><h2>Vos tâches</h2><div id="tasks"></div><p id="notice" role="status"></p><footer>Les échéances sont vérifiées chaque minute, sans appel à un modèle.<br>Une tâche en cours ne peut pas être interrompue depuis ce panneau. Fermer ce panneau laisse le service fonctionner.</footer></main>
<script>
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);
const labels={ready:'Reprise programmée',running:'En cours',paused:'En pause',finished:'Exécution terminée',needs_review:'À vérifier',needs_path:'Projet à reconnecter'};
async function request(path,options={}){const r=await fetch(path,{...options,headers:{'X-Resume-Token':token,'Content-Type':'application/json'}});if(!r.ok){const d=await r.json();throw Error(d.error||'Le panneau est indisponible. Rouvrez-le avec la commande dashboard.')}return r.json()}
async function refresh(){try{const rows=await request('/tasks');for(const s of ['ready','running','paused'])document.getElementById(s).textContent=rows.filter(r=>r.status===s).length;const list=document.getElementById('tasks');list.replaceChildren();if(!rows.length){const e=document.createElement('div');e.className='empty';const h=document.createElement('strong');h.textContent='Tout est tranquille.';const p=document.createElement('p');p.textContent='Ajoutez une session et son heure de reprise avec la commande resume add.';e.append(h,p);list.append(e)}for(const r of rows){const a=document.createElement('article'),info=document.createElement('div'),h=document.createElement('h3'),p=document.createElement('p'),b=document.createElement('p'),btn=document.createElement('button');h.textContent=r.cwd.split('/').filter(Boolean).pop();p.textContent=new Date(r.due*1000).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'});b.className='badge';b.textContent=labels[r.status]||r.status;btn.textContent=r.status==='ready'?'Mettre en pause':'Programmer la reprise';btn.disabled=['running','finished','needs_review','needs_path'].includes(r.status);btn.onclick=async()=>{btn.disabled=true;try{await request('/task',{method:'POST',body:JSON.stringify({id:r.id,action:r.status==='ready'?'pause':'enable'})});await refresh()}catch(e){document.getElementById('notice').textContent=e.message}};info.append(h,p,b);a.append(info,btn);list.append(a)}}catch(e){document.getElementById('notice').textContent=e.message}}
refresh();setInterval(refresh,15000);
</script></html>
